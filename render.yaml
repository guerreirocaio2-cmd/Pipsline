services:
  - type: web
    name: pipsfit
    runtime: node
    plan: free
    region: oregon
    branch: main
    numInstances: 1
    autoDeploy: false
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PIPSFIT_STORAGE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: PIPSFIT_ENCRYPTION_KEY
        generateValue: true
      - key: PIPSFIT_SETUP_TOKEN
        generateValue: true
